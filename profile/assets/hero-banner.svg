<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1561FF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1561FF" stop-opacity="0.6" />
    </linearGradient>

    <!-- Brand Electric Blue Ambient Glows -->
    <radialGradient id="blue-core-glow" cx="18%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1561FF" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#1561FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1561FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-accent-glow" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#334155" fill-opacity="0.35" />
    </pattern>

    <!-- Soft Logo Shadow Filter -->
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .brand-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #38BDF8;
      text-transform: uppercase;
    }
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #FFFFFF;
    }
    .brand-tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.2px;
      fill: #94A3B8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      fill: #E2E8F0;
    }
    .code-accent {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      fill: #60A5FA;
    }
  </style>

  <!-- Card Background with border -->
  <rect x="2" y="2" width="1276" height="356" rx="18" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect x="2" y="2" width="1276" height="356" rx="18" fill="url(#blue-core-glow)" />
  <rect x="2" y="2" width="1276" height="356" rx="18" fill="url(#cyan-accent-glow)" />

  <!-- Dot Grid Texture -->
  <rect x="2" y="2" width="1276" height="356" rx="18" fill="url(#dot-grid)" />

  <!-- Geometric Tech Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.65">
    <line x1="90" y1="0" x2="90" y2="360" stroke-dasharray="4 6" />
    <line x1="320" y1="0" x2="320" y2="360" stroke-dasharray="2 8" />
    <line x1="0" y1="80" x2="1280" y2="80" stroke-opacity="0.3" />
    <line x1="0" y1="280" x2="1280" y2="280" stroke-opacity="0.3" />
  </g>

  <!-- Left: Official Blue Vistaran Logo Pod (Properly Centered, Generous Margins, Zero Stray Dots) -->
  <g transform="translate(95, 85)">
    <!-- Container Backdrop with smooth rounded corners -->
    <rect x="0" y="0" width="190" height="190" rx="24" fill="#0A1122" stroke="#1D2A4A" stroke-width="1.5" />
    <rect x="4" y="4" width="182" height="182" rx="20" fill="#080D1A" fill-opacity="0.9" />

    <!-- Perfectly Centered Logo with 32px safe padding all around -->
    <svg x="32" y="38" width="126" height="114" viewBox="234 349 1631 1400" filter="url(#logo-glow)">
      <path fill="#1561FF" d="M 363.5,350.5 C 320.663,350.168 277.997,350.501 235.5,351.5C 234.957,351.44 234.624,351.107 234.5,350.5C 277.665,349.169 320.665,349.169 363.5,350.5 Z"/>
      <path fill="#1561FF" d="M 1446.5,350.5 C 1585.67,349.167 1725,349.167 1864.5,350.5C 1864.38,351.107 1864.04,351.44 1863.5,351.5C 1724.67,350.5 1585.67,350.167 1446.5,350.5 Z"/>
      <path fill="#1561FF" d="M 363.5,350.5 C 466.312,529.462 570.145,707.795 675,885.5C 708.586,943.671 741.92,1002 775,1060.5C 888.338,1253.17 1001.17,1446.17 1113.5,1639.5C 1092.42,1676 1071.09,1712.33 1049.5,1748.5C 903.002,1499.15 757.502,1249.15 613,998.5C 487.155,782.806 361.322,567.139 235.5,351.5C 277.997,350.501 320.663,350.168 363.5,350.5 Z"/>
      <path fill="#1561FF" d="M 1671.5,462.5 C 1672.04,462.44 1672.38,462.107 1672.5,461.5C 1617.67,460.169 1563,460.169 1508.5,461.5C 1405.68,638.473 1302.85,815.473 1200,992.5C 1199.33,993.833 1198.67,993.833 1198,992.5C 1177.33,957.167 1156.67,921.833 1136,886.5C 1135.33,885.167 1135.33,883.833 1136,882.5C 1239.36,704.998 1342.86,527.664 1446.5,350.5C 1585.67,350.167 1724.67,350.5 1863.5,351.5C 1641,734.503 1418,1117.17 1194.5,1499.5C 971.374,1116.75 748.374,733.915 525.5,351C 568.404,350.17 611.238,350.337 654,351.5C 834.167,661.167 1014.33,970.833 1194.5,1280.5C 1354,1008.17 1513,735.503 1671.5,462.5 Z"/>
      <path fill="#1561FF" d="M 1508.5,461.5 C 1563,460.169 1617.67,460.169 1672.5,461.5C 1672.38,462.107 1672.04,462.44 1671.5,462.5C 1617.34,461.501 1563,461.168 1508.5,461.5 Z"/>
    </svg>
  </g>

  <!-- Typography & Information Section -->
  <g transform="translate(345, 95)">
    <!-- Eyebrow Tag -->
    <text x="0" y="16" class="brand-eyebrow">Vistaran Techtronix • Enterprise AI Engineering</text>

    <!-- Main Title -->
    <text x="0" y="68" class="brand-title">Engineering Intelligent Solutions.</text>

    <!-- Subtitle / Headline 2 -->
    <text x="0" y="106" class="brand-tagline">Autonomous Agents <tspan fill="#334155">•</tspan> Enterprise RAG <tspan fill="#334155">•</tspan> Private LLMs <tspan fill="#334155">•</tspan> Cloud Architecture</text>

    <!-- Feature Pills with generous container widths & balanced spacing -->
    <g transform="translate(0, 138)">
      <!-- Pill 1: Location -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="158" height="30" rx="15" fill="#0C1425" stroke="#1E2A44" stroke-width="1" />
        <circle cx="15" cy="15" r="3.5" fill="#10B981" />
        <text x="26" y="19" class="pill-text">Gandhinagar, India</text>
      </g>

      <!-- Pill 2: AI First -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="168" height="30" rx="15" fill="#0C1425" stroke="#1E2A44" stroke-width="1" />
        <circle cx="15" cy="15" r="3.5" fill="#1561FF" />
        <text x="26" y="19" class="pill-text">AI-First Engineering</text>
      </g>

      <!-- Pill 3: Autonomous Workflows (Wider badge so text has plenty of breathing room) -->
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="186" height="30" rx="15" fill="#0C1425" stroke="#1E2A44" stroke-width="1" />
        <circle cx="15" cy="15" r="3.5" fill="#38BDF8" />
        <text x="26" y="19" class="pill-text">Autonomous Workflows</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(548, 0)">
        <rect x="0" y="0" width="126" height="30" rx="15" fill="#0C1425" stroke="#1E2A44" stroke-width="1" />
        <circle cx="15" cy="15" r="3.5" fill="#818CF8" />
        <text x="26" y="19" class="pill-text">Open Source</text>
      </g>
    </g>
  </g>

  <!-- Top Right System Status / Terminal Badge -->
  <g transform="translate(1030, 36)">
    <rect x="0" y="0" width="206" height="32" rx="16" fill="#0A1224" stroke="#1D2A4A" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#1561FF">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="20" class="code-accent">vistaran.com // online</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="18" y="356" width="1244" height="2" fill="url(#border-grad)" />
</svg>
